run:
  output_root: output/tasks
  experiment: rigid_reconstruction_random_ei
  run_id: null
model: {model_type: random_ei, N: 15, device: cpu, seed: 7}
network:
  dt: 0.0001
  tau_e: 0.01
  tau_i: 0.01
  K: 100.0
  J_ee: 1.0
  J_ei: -4.0
  J_ie: 2.0
  J_ii: -2.0
  sigma_e: 0.05
  sigma_i: 0.07071067811865477
  u_e: 10.0
  u_i: 0.0
  stimulus_gain: 10.0
  init_scale: 0.1
  baseline_mode: add
  field_clip: null
  init_steps: 50
  recurrent_gain: 0.8
  recurrent_sparsity: 0.5
task: {steps: 150, smoothing_width: 0.06666666666666667, shift_distance: 5.0}
learning:
  learning_method: rls
  training_trials: 1
  evaluation_trials: 2
  epochs: 2
  learning_rate: 0.01
  delta: 1.0
  forgetting_factor: 1.0
  evaluation_perturbation: 0.1
